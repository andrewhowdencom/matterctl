version: '3'

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Download Go dependencies
    cmds:
      - go mod download

  generate:
    desc: Run Go code generation
    cmds:
      - go generate ./...

  build:
    desc: Build bin/matterctl
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/matterctl ./cmd/matterctl

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  web:test:
    desc: Test the browser inventory state and event stream
    cmds:
      - node --test internal/server/web/app.test.mjs

  lint:
    desc: Check Go formatting and run golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: Install golangci-lint v2 (https://golangci-lint.run/docs/welcome/install/)
      - sh: test -z "$(gofmt -l cmd internal)"
        msg: Run gofmt on cmd/ and internal/ before validating
    cmds:
      - golangci-lint run

  validate:
    desc: Run formatting, lint, Go and browser tests, and the build
    cmds:
      - task: lint
      - task: test
      - task: web:test
      - task: build

  run:
    desc: Start the browser interface locally
    cmds:
      - go run ./cmd/matterctl serve {{.CLI_ARGS}}

  container:build:
    desc: Build the image in the rootful Podman store
    cmds:
      - sudo podman build --tag localhost/matterctl:latest --file Containerfile .

  automation:example:
    desc: Copy the BILRESA and Den example into the XDG automation directory
    cmds:
      - |
        automation_dir="${XDG_CONFIG_HOME:-$HOME/.config}/matterctl/automations"
        if test -e "$automation_dir/bilresa-den.star"; then
          echo "Example already exists: $automation_dir/bilresa-den.star" >&2
          exit 1
        fi
        install -D -m 0644 examples/bilresa-den.star "$automation_dir/bilresa-den.star"

  install:
    desc: Validate, mount XDG automations, install the Quadlet, and restart matterctl
    cmds:
      - task: validate
      - |
        automation_dir="${XDG_CONFIG_HOME:-$HOME/.config}/matterctl/automations"
        case "$automation_dir" in
          /*) ;;
          *) echo "XDG_CONFIG_HOME must be absolute" >&2; exit 1 ;;
        esac
        case "$automation_dir" in
          *:*) echo "automation directory cannot contain a colon" >&2; exit 1 ;;
        esac
        install -d -m 0755 "$automation_dir"
        ./bin/matterctl automation check --automation.directory "$automation_dir"
      - task: container:build
      - |
        automation_dir="${XDG_CONFIG_HOME:-$HOME/.config}/matterctl/automations"
        generated="$(mktemp)"
        trap 'rm -f "$generated"' EXIT
        awk -v source="$automation_dir" '
          /^\[Container\]$/ { print; print "Volume=" source ":/config/matterctl/automations:ro"; next }
          { print }
        ' deploy/matterctl.container > "$generated"
        sudo install -D -m 0644 "$generated" /etc/containers/systemd/matterctl.container
        sudo systemctl daemon-reload
        sudo systemctl restart matterctl.service
        sudo systemctl is-active --quiet matterctl.service
